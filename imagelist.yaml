# Image mapping file used by .github/workflows/sync-images.yml.
# Format:
#   source-registry/namespace/image:tag: target-registry/namespace/image:tag
# Keep only the images you want to synchronize in the `images` section.
images:
  docker.io/library/nginx:1.27-alpine: registry.example.com/mirror/nginx:1.27-alpine
  quay.io/prometheus/node-exporter:v1.8.2: registry.example.com/mirror/prometheus-node-exporter:v1.8.2

# Optional archive for mappings that are no longer synchronized.
# Move entries here instead of deleting them if you want a lightweight audit trail.
historyRecord: {}
